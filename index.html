<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>爱豆模拟器</title>

<style>
/* ===== iOS 基础 ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #ffeef4;
  overflow: hidden;
  position: relative;
}

/* ===== 背景圆点 ===== */
.dots {
  position: absolute;
  inset: 0;
  z-index: 0;
}

.dot {
  position: absolute;
  border-radius: 50%;
  opacity: 0.65;
  animation: float 6s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* ===== 主内容 ===== */
.container {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* iOS 时间 */
.time {
  font-size: 88px;
  font-weight: 200;
  color: #ffffff;
  letter-spacing: -2px;
}

.date {
  font-size: 18px;
  font-weight: 400;
  color: #fff;
  margin-top: 6px;
  opacity: 0.95;
}

/* 标题 */
.title {
  margin-top: 36px;
  font-size: 28px;
  font-weight: 500;
  color: #ffffff;
  letter-spacing: 1px;
}

/* 底部提示（可选） */
.hint {
  position: absolute;
  bottom: 34px;
  font-size: 13px;
  color: rgba(255,255,255,0.85);
}
</style>
</head>

<body>

<!-- 彩色圆点 -->
<div class="dots" id="dots"></div>

<!-- 主界面 -->
<div class="container">
  <div>
    <div class="time" id="time">00:00</div>
    <div class="date" id="date">2026年5月30日 星期六</div>
  </div>

  <div class="title">爱豆模拟器</div>
</div>

<!-- 底部轻提示 -->
<div class="hint">向上滑动以进入</div>

<script>
/* ===== 时间 ===== */
function updateTime() {
  const now = new Date();
  document.getElementById("time").textContent =
    now.toLocaleTimeString("zh-CN", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("zh-CN", {
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "long"
    });
}
updateTime();
setInterval(updateTime, 1000);

/* ===== 圆点 ===== */
const colors = ["#ffb3c6","#ffd6a5","#fdffb6","#caffbf","#9bf6ff","#a0c4ff"];
const dots = document.getElementById("dots");

for (let i = 0; i < 28; i++) {
  const d = document.createElement("div");
  d.className = "dot";
  const size = Math.random() * 12 + 6;
  d.style.width = `${size}px`;
  d.style.height = `${size}px`;
  d.style.left = `${Math.random() * 100}%`;
  d.style.top = `${Math.random() * 100}%`;
  d.style.background = colors[Math.floor(Math.random() * colors.length)];
  d.style.animationDuration = `${5 + Math.random() * 3}s`;
  dots.appendChild(d);
}
</script>

</body>
</html>
